name: Dragon Tory CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static checks
        run: ruff check src tests

      - name: Compile
        run: python -m compileall -q src tests

      - name: Test
        run: pytest -q


  portable-launcher:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate portable launcher
        shell: cmd
        run: Start.bat --check

      - name: Validate Russian Windows path and OEM code page
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Русский путь\Дракончик Тоору"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "*") -Destination $target -Recurse -Force

          $launcher = Join-Path $target "Start.bat"
          $command = 'chcp 866 >nul & call "' + $launcher + '" --check'
          cmd.exe /d /c $command
          if ($LASTEXITCODE -ne 0) {
            throw "Start.bat failed from a Cyrillic path under code page 866."
          }

      - name: Validate bootstrap Python source policy
        shell: pwsh
        run: |
          $content = Get-Content -LiteralPath "scripts\windows\bootstrap.ps1" -Raw
          if ($content -notmatch 'https://www\.python\.org/ftp/python/') {
            throw "Bootstrap is not pinned to python.org."
          }
          if ($content -notmatch 'Get-AuthenticodeSignature') {
            throw "Bootstrap does not verify the Python installer signature."
          }
          if ($content -notmatch 'pyproject\.toml') {
            throw "Bootstrap does not derive dependencies from pyproject.toml."
          }

      - name: Validate update script syntax and protected data
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "scripts\windows\update.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object {
              Write-Host ("line {0}, col {1}: {2} | {3}" -f $_.Extent.StartLineNumber, $_.Extent.StartColumnNumber, $_.Message, $_.Extent.Text)
            }
            throw "update.ps1 contains PowerShell syntax errors."
          }

          $content = Get-Content -LiteralPath "scripts\windows\update.ps1" -Raw
          foreach ($protected in @(".env", ".venv", "data", "runtime", "logs", "backups")) {
            if ($content -notmatch [regex]::Escape('"' + $protected + '"')) {
              throw "Updater does not protect: $protected"
            }
          }
