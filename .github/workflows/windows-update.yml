name: Dragon Tory Windows Self Update

on:
  push:
    branches: [main]
    paths:
      - "src/tooru/update/**"
      - "src/tooru/version.py"
      - "src/tooru/api/update.py"
      - "scripts/windows/update.ps1"
      - "scripts/windows/bootstrap.ps1"
      - "Start.bat"
      - "pyproject.toml"
      - ".github/workflows/windows-update.yml"
  pull_request:
    paths:
      - "src/tooru/update/**"
      - "src/tooru/api/update.py"
      - "scripts/windows/update.ps1"
      - "scripts/windows/bootstrap.ps1"
      - "Start.bat"
      - "pyproject.toml"
      - ".github/workflows/windows-update.yml"
  workflow_dispatch:

jobs:
  self-update:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare Cyrillic portable copy
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Обновление\Дракончик Тоору"
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE "*") -Destination $target -Recurse -Force

          $versionFile = Join-Path $target "src\tooru\version.py"
          $versionText = Get-Content -LiteralPath $versionFile -Raw -Encoding utf8
          $versionText = $versionText -replace '__version__ = "0\.0\.8"', '__version__ = "0.0.7"'
          Set-Content -LiteralPath $versionFile -Value $versionText -Encoding utf8

          "UPDATE_TEST_ROOT=$target" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          @(
            "TOORU_TEST_SENTINEL=preserve-me"
            "TOORU_CLAUDE_API_KEY=legacy-secret-must-be-removed"
            "TOORU_CLAUDE_MODEL=legacy-claude"
          ) | Set-Content -LiteralPath (Join-Path $target ".env") -Encoding utf8
          New-Item -ItemType Directory -Path (Join-Path $target "data") -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $target "data\preserve.txt") -Value "keep-memory-data" -Encoding utf8

      - name: Prepare virtual environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:UPDATE_TEST_ROOT ".venv"
          python -m venv $venv
          $python = Join-Path $venv "Scripts\python.exe"
          & $python -m pip install --disable-pip-version-check --editable $env:UPDATE_TEST_ROOT
          if ($LASTEXITCODE -ne 0) {
            throw "Could not prepare test .venv."
          }

      - name: Start old Dragon Tory instance
        shell: pwsh
        run: |
          $python = Join-Path $env:UPDATE_TEST_ROOT ".venv\Scripts\python.exe"
          $env:PYTHONPATH = Join-Path $env:UPDATE_TEST_ROOT "src"
          $env:TOORU_DATA_DIR = Join-Path $env:UPDATE_TEST_ROOT "data"
          $process = Start-Process -FilePath $python -ArgumentList @("-m", "tooru.main") -WorkingDirectory $env:UPDATE_TEST_ROOT -PassThru
          "OLD_SERVER_PID=$($process.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          $ready = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
              if ($health.status -eq "ok") {
                $ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            throw "Old Dragon Tory instance did not start."
          }

          $chat = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v1/chats" -Method Post -ContentType "application/json" -Body '{"title":"Чат до обновления"}' -TimeoutSec 5
          "PRESERVED_CHAT_ID=$($chat.id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Run real self updater through web API
        shell: pwsh
        run: |
          $before = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 5
          if ($before.version -ne "00.00.07") {
            throw "Expected simulated old version 00.00.07, got $($before.version)."
          }

          try {
            $started = Invoke-RestMethod -Uri "http://127.0.0.1:8787/v1/update/install" -Method Post -ContentType "application/json" -Body '{"force":false}' -TimeoutSec 15
            if (-not $started.running) {
              throw "Update API did not report a running updater."
            }
          } catch {
            Write-Host "Update API exception: $($_.Exception.Message)"
            $statePath = Join-Path $env:UPDATE_TEST_ROOT "data\update\state.json"
            if (Test-Path -LiteralPath $statePath) {
              Write-Host "--- state.json ---"
              Get-Content -LiteralPath $statePath -Raw
            }
            $launchLog = Join-Path $env:UPDATE_TEST_ROOT "logs\update-launcher.log"
            if (Test-Path -LiteralPath $launchLog) {
              Write-Host "--- update-launcher.log ---"
              Get-Content -LiteralPath $launchLog -Raw
            }
            $updateLog = Join-Path $env:UPDATE_TEST_ROOT "logs\update.log"
            if (Test-Path -LiteralPath $updateLog) {
              Write-Host "--- update.log ---"
              Get-Content -LiteralPath $updateLog -Raw
            }
            throw "Update API failed to launch updater."
          }

          $ready = $false
          for ($i = 0; $i -lt 300; $i++) {
            try {
              $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 2
              if ($health.status -eq "ok" -and $health.version -eq "00.00.08") {
                $ready = $true
                break
              }
            } catch {}
            Start-Sleep -Seconds 1
          }
          if (-not $ready) {
            throw "Dragon Tory did not restart on 00.00.08 after API-triggered update."
          }

      - name: Verify restart and protected local data
        shell: pwsh
        run: |
          $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 5
          if ($health.status -ne "ok") {
            throw "Updated Dragon Tory is not healthy."
          }

          $statePath = Join-Path $env:UPDATE_TEST_ROOT "data\update\state.json"
          $state = Get-Content -LiteralPath $statePath -Raw -Encoding utf8 | ConvertFrom-Json
          if ($state.phase -ne "success") {
            throw "Updater state is not success: $($state.phase)"
          }
          if ([int]$state.progress_percent -ne 100) {
            throw "Updater progress did not reach 100 percent."
          }
          if (@($state.downloaded_files).Count -lt 1) {
            throw "Updater did not record downloaded files."
          }

          $historyPath = Join-Path $env:UPDATE_TEST_ROOT "data\update\history.json"
          if (-not (Test-Path -LiteralPath $historyPath)) {
            throw "Updater did not create update history."
          }
          $history = @(
            Get-Content -LiteralPath $historyPath -Raw -Encoding utf8 |
              ConvertFrom-Json
          )
          if ($history.Count -lt 1) {
            throw "Update history is empty."
          }
          $last = $history[-1]
          if ($last.result -ne "success") {
            throw "Last update history entry is not successful."
          }
          if (@($last.downloaded_files).Count -lt 1) {
            throw "History does not contain downloaded file manifest."
          }

          $dataSentinel = Get-Content -LiteralPath (Join-Path $env:UPDATE_TEST_ROOT "data\preserve.txt") -Raw
          if ($dataSentinel.Trim() -ne "keep-memory-data") {
            throw "Updater changed protected data."
          }

          $envSentinel = Get-Content -LiteralPath (Join-Path $env:UPDATE_TEST_ROOT ".env") -Raw
          if ($envSentinel -notmatch "TOORU_TEST_SENTINEL=preserve-me") {
            throw "Updater changed protected .env."
          }
          if ($envSentinel -match "TOORU_CLAUDE_") {
            throw "Legacy Claude settings were not removed from .env."
          }

          $python = Join-Path $env:UPDATE_TEST_ROOT ".venv\Scripts\python.exe"
          $packages = @(& $python -m pip list --format=json | ConvertFrom-Json)
          if ($packages.name -contains "anthropic") {
            throw "Legacy anthropic package is still installed."
          }

          $page = (Invoke-WebRequest -Uri "http://127.0.0.1:8787/" -UseBasicParsing -TimeoutSec 5).Content
          if ($page -match "Клод|Anthropic|chatProject|chatProvider") {
            throw "Web UI still contains legacy Claude/project/model controls."
          }

          $preservedChat = Invoke-RestMethod -Uri ("http://127.0.0.1:8787/v1/chats/" + $env:PRESERVED_CHAT_ID) -TimeoutSec 5
          if ($preservedChat.title -ne "Чат до обновления") {
            throw "Persistent chat history did not survive self-update."
          }
          if (-not (Test-Path -LiteralPath (Join-Path $env:UPDATE_TEST_ROOT "data\chat\tooru_chat.sqlite3"))) {
            throw "Chat history database is missing after self-update."
          }

          if (-not (Test-Path -LiteralPath (Join-Path $env:UPDATE_TEST_ROOT "backups"))) {
            throw "Updater did not create a backup."
          }

      - name: Cleanup server
        if: always()
        shell: pwsh
        run: |
          try {
            Get-NetTCPConnection -LocalPort 8787 -State Listen -ErrorAction Stop |
              Select-Object -ExpandProperty OwningProcess -Unique |
              ForEach-Object { Stop-Process -Id $_ -Force -ErrorAction SilentlyContinue }
          } catch {}
