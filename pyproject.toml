[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dragon-tory"
dynamic = ["version"]
description = "Dragon Tory personal AI assistant with isolated personal and project memory."
readme = "README.md"
requires-python = ">=3.11"
# Tory Document Intelligence, OCR support and Tory Vault ship with the portable app.
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.32,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "openai>=1.60,<3.0",
  "psutil>=6.1,<8.0",
  "pypdf>=5.0,<7.0",
  "pillow>=10,<13",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "python-pptx>=1.0,<2.0",
  "odfpy>=1.4,<2.0",
  "striprtf>=0.0.28,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "charset-normalizer>=3.4,<4.0",
  "xlrd>=2.0,<3.0",
  "pyxlsb>=1.0,<2.0",
  "extract-msg>=0.55,<1.0",
  "ebooklib>=0.19,<1.0",
  "PyMuPDF>=1.25,<2.0",
  "cryptography>=43,<49",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]
e2e = [
  "playwright>=1.49,<2.0",
]
semantic = [
  "fastembed>=0.7,<1.0",
]

[project.scripts]
dragon-tory = "tooru.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "tooru.version.__version__"}

[tool.setuptools.package-data]
# Keep the system-brain graph library available in offline portable installs.
tooru = [
  "web/*.html",
  "web/*.css",
  "web/*.js",
  "web/vendor/*.js",
  "web/vendor/*.txt",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100
